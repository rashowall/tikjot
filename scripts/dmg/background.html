<!doctype html>
<!-- DMG window background (640×400 pt; rendered @2x into background.png by scripts/dmg/render-background.sh).
     The icon slots are set in scripts/dmg-settings.py: tikjot.app centred at (160, 190), Applications at (480, 190),
     128 px icons with their labels below (to y ≈ 285). Keep text out of those areas; keep anything important above
     y ≈ 370 (Finder may count the title bar in the window height). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Bricolage Grotesque"; font-weight: 500 800;
    src: url(../../website/site/fonts/bricolage-grotesque-latin.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 400 700;
    src: url(../../website/site/fonts/inter-latin.woff2) format("woff2"); }
  :root { --bg: #F8F6FB; --text: #17152A; --text-2: #5F5B73; --brand: #4B36D6; }
  html, body { margin: 0; width: 640px; height: 400px; overflow: hidden; background: var(--bg); -webkit-font-smoothing: antialiased; }
  .bg { position: relative; width: 640px; height: 400px; overflow: hidden;
    background:
      radial-gradient(260px 200px at 160px 190px, rgb(75 54 214 / .07), transparent 70%),
      radial-gradient(260px 200px at 480px 190px, rgb(75 54 214 / .07), transparent 70%),
      var(--bg); }
  h1 { position: absolute; left: 0; right: 0; top: 40px; margin: 0; text-align: center; color: var(--text);
    font: 700 27px/1.1 "Bricolage Grotesque", sans-serif; letter-spacing: -.02em; }
  p { position: absolute; left: 0; right: 0; top: 318px; margin: 0; text-align: center; color: var(--text-2);
    font: 400 13px/1.3 "Inter", sans-serif; }
  svg { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div class="bg">
  <h1>Drag tikjot to Applications</h1>
  <svg width="640" height="400" viewBox="0 0 640 400" fill="none" stroke="#4B36D6" stroke-linecap="round" stroke-linejoin="round">
    <!-- a gentle arc from the app slot to the Applications slot -->
    <g stroke-width="5" opacity=".55">
      <path d="M 256 196 Q 320 156 384 196"/>
      <path d="M 375 179 L 384 196 L 365 197"/>
    </g>
  </svg>
  <p>Then open it from Applications · macOS 14 or later</p>
</div>
</body>
</html>
